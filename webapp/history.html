<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History · Hastavāṇī</title>
    <meta name="description" content="Everything you have signed with Hastavāṇī: translated words, recognised sentences and math." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--HEADER-->

    <main class="mx-auto max-w-4xl px-5 pb-8 pt-10">
      <div class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
        <div>
          <p class="eyebrow">Your activity</p>
          <h1 class="mt-2 text-4xl font-extrabold md:text-5xl">History</h1>
          <p class="mt-3 max-w-xl text-ink/70">
            Words you spelled, sentences it recognised and sums you signed, newest first. Saved only in this
            browser, for <strong id="history-user">you</strong>.
          </p>
        </div>
        <button id="history-clear" class="btn-ghost shrink-0 !border-accent/40 !text-accent hover:!bg-accent-soft">Clear history</button>
      </div>

      <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="inline-flex w-fit flex-wrap rounded-full border border-ink/15 bg-surface p-1 shadow-sm" role="tablist" aria-label="Filter history">
          <button class="mode-btn" role="tab" aria-selected="true" data-filter="all">All</button>
          <button class="mode-btn" role="tab" aria-selected="false" data-filter="translate">Translator</button>
          <button class="mode-btn" role="tab" aria-selected="false" data-filter="sentence">Sentences</button>
          <button class="mode-btn" role="tab" aria-selected="false" data-filter="math">Math</button>
        </div>
        <label class="relative block sm:w-64">
          <span class="sr-only">Search history</span>
          <input id="history-search" type="search" placeholder="Search…" autocomplete="off"
                 class="w-full rounded-full border border-ink/15 bg-surface px-5 py-2.5 text-sm placeholder:text-ink/40 focus:border-brand focus:outline-none" />
        </label>
      </div>

      <p id="history-summary" class="mt-5 text-sm text-ink/50"></p>
      <div id="history-list" class="mt-3 space-y-8"></div>

      <div id="history-empty" class="card mt-6 hidden text-center">
        <p class="text-4xl" aria-hidden="true">🖐️</p>
        <p class="mt-3 font-display text-xl font-bold">Nothing here yet</p>
        <p class="mt-1 text-sm text-ink/60">Use the translator, sentence builder or math page and it will show up here.</p>
        <div class="mt-5 flex flex-wrap justify-center gap-2">
          <a href="/translate.html" class="btn-primary">Open the translator</a>
          <a href="/sentence.html" class="btn-ghost">Sentence builder</a>
        </div>
      </div>
    </main>

    <!--FOOTER-->
    <script type="module" src="/src/historyPage.ts"></script>
    <script type="module" src="/src/site.ts"></script>
  </body>
</html>
